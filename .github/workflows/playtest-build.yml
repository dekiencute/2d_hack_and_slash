name: Stylebreaker Playtest Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stylebreaker-playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Godot checks and Windows QA ZIP
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7'
          use-dotnet: false
          include-templates: true

      - name: Resolve actual Godot Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # On Windows the setup action can add a no-extension `godot` shim
          # to PATH. Pass the real .exe to Python subprocess instead.
          $roots = @(
            (Join-Path $env:USERPROFILE 'godot'),
            (Join-Path $env:USERPROFILE 'bin'),
            (Join-Path $env:GITHUB_WORKSPACE 'godot')
          ) | Select-Object -Unique
          $candidates = @()
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              $candidates += @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.exe' -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '(?i)godot' -and $_.Name -notmatch '(?i)mono|dotnet' })
            }
          }
          $expected = '4.7'
          $selected = $null
          foreach ($candidate in ($candidates | Sort-Object FullName -Unique)) {
            $output = @(& $candidate.FullName --headless --version 2>&1)
            $code = $LASTEXITCODE
            $version = ($output | Out-String).Trim()
            Write-Host "Candidate: $($candidate.FullName) (exit $code, version '$version')"
            if ($code -eq 0 -and $version -match "^$([regex]::Escape($expected))\.stable\.") {
              $selected = $candidate.FullName
              break
            }
          }
          if (-not $selected) {
            throw "No working Godot $expected executable found; PATH shim is not a valid executable for the release script."
          }
          Write-Host "Selected Godot: $selected"
          "GODOT_BIN=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate validated Windows playtest package
        shell: pwsh
        run: |
          if (-not $env:GODOT_BIN) { throw 'GODOT_BIN was not resolved' }
          python tools/release.py --godot "$env:GODOT_BIN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows QA build and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stylebreaker-windows-playtest-${{ github.sha }}
          path: |
            dist/release-candidate/*.zip
            dist/release-candidate/*.sha256
          if-no-files-found: error
          retention-days: 14

name: Stylebreaker Playtest Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stylebreaker-playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Godot checks and Windows QA ZIP
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.6.3'
          use-dotnet: false
          include-templates: true

      - name: Resolve installed Godot executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Get-Command godot -ErrorAction Stop
          $godotExe = $cmd.Source
          if (-not (Test-Path -LiteralPath $godotExe -PathType Leaf)) {
            throw "Godot executable not found at: $godotExe"
          }
          $version = & $godotExe --version
          Write-Host "Godot executable: $godotExe"
          Write-Host "Godot version: $version"
          if ($LASTEXITCODE -ne 0 -or -not ($version -match '^4\.6\.3')) {
            throw "Expected Godot 4.6.3, got: $version"
          }
          "GODOT_BIN=$godotExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate validated Windows playtest package
        shell: pwsh
        run: |
          if (-not $env:GODOT_BIN) { throw 'GODOT_BIN was not exported by the setup step' }
          python tools/release.py --godot "$env:GODOT_BIN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows QA build and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stylebreaker-windows-playtest-${{ github.sha }}
          path: |
            dist/release-candidate/*.zip
            dist/release-candidate/*.sha256
          if-no-files-found: error
          retention-days: 14
